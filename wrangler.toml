name = "blog"
account_id = "fcaa04edb848e219bd85f8bfedb0c5b9"
workers_dev = true

main = "worker.js"
compatibility_date = "2020-12-17"
compatibility_flags = ["nodejs_compat"]

[vars]
UI_URL = "https://sradams.co.uk"

# Cache for GitHub-derived responses (see cache.js)
[[kv_namespaces]]
binding = "BLOG_CACHE"
id = "4d893e2af99042f0960b7a241cf5d93e"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = true
